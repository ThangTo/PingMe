<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171A17" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        try {
          const colors = { light: '#FBFAF7', dark: '#171A17' };
          const preference = localStorage.getItem('pingme_theme') || 'system';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
          const color = colors[theme] || colors.light;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.backgroundColor = color;
          const applyThemeColor = () => {
            document.querySelectorAll('meta[name="theme-color"]').forEach((meta) => {
              meta.setAttribute('content', color);
            });
          };
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', applyThemeColor, { once: true });
          } else {
            applyThemeColor();
          }
        } catch {
          // Nếu trình duyệt chặn storage, app giữ màu light mặc định.
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PingMe" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link href="/src/index.css" rel="stylesheet" />
    <title>PingMe</title>
    <meta
      name="description"
      content="PingMe là ứng dụng chat realtime."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
